[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "etl-wore"
version = "0.1.0"
description = "Lightweight, extensible ETL Workflow and Orchestration Engine in Python"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Ayush Tiwari", email = "147244828+Ayushdevo@users.noreply.github.com"}
]
dependencies = [
    "pydantic>=2.0.0",
    "python-dateutil>=2.8.2",
    "requests>=2.28.0",
    "pyyaml>=6.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "flake8>=6.0.0",
    "black>=23.0.0"
]

[project.scripts]
etl-wore = "etl_wore.cli:main"
